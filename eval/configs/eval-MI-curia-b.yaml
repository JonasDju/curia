# Standalone KneeNo classification evaluation of an official Curia checkpoint -- config for
# eval/eval_curia_kneeno.py (--config). Submit from the repo root with
#     sbatch eval/submit_eval_curia_kneeno.sh
# Exactly two top-level keys: model_name and eval. Env vars ($VAR, ${VAR}, leading ~) are expanded everywhere; an
# unset one is an error.
#
# Outputs, all inside a dedicated folder: TensorBoard test metrics (eval.logging.tensorboard_dir), per-label
# CSVs (eval.logging.per_label_dir), and in the parent of per_label_dir the final metrics (results.json) and this
# config with env vars expanded (params.yaml). The script refuses to start if any of them already exist.

model_name: raidium/curia

# KneeNo classification evaluation -- see KneeNo/kneeno/evaluation/config.py for every key and its default.
eval:
  seed: 239
  amp_dtype: bfloat16  # frozen-encoder forward under autocast (CUDA only); null -> float32. Heads still train in float32.
  cache_features: true  # linear / linear_pool / linear_slice_cls / attentive_slice_cls train on features extracted
                        # once instead of re-encoding every head epoch; k-NN always uses the shared pass.
                        # attentive_pool / attentive_slice_pool never cache.
  extraction_batch_size: 8
  split:  # the internal global "train" split is cut into train and val; the test sets are used whole
    val_fraction: 0.2  # heads are scored on val every head epoch (early stopping)
  training:
    early_stop_on: auroc  # val metric that picks each head's best epoch
    early_stop_patience: 5  # head epochs without a val improvement before stopping; 0 = never stop early
    loss: BCE
  verbose: true  # log each task's start and every head epoch's val metrics
  data:
    # internal: global "train" (the heads' train/val) + "val" (the "internal" test set); external: global "test".
    # Both are extracted to $TMP/kneeno_data by eval/submit_eval_curia_kneeno.sh.
    data_root: {internal: $TMP/kneeno_data/internal, external: $TMP/kneeno_data/external}
    label_meta:
      internal: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_labeled.json
      external: /hpcwork/p0021834/workspace_roman/jonas/metadata/external_labeled.json
    test_sets: [internal, external]  # heads are trained once and scored on both
    series_depth: 24  # slices per volume the encoder sees one by one; also the slice count of the slice tasks
    resample_mode: nearest
    num_workers: 31
    prefetch_factor: 8  # batches each worker loads ahead; worker RAM in flight ~ num_workers * prefetch_factor batches
    subset: 1.0  # seeded subsample of the internal "train" EXAMS (test sets always whole): float in (0, 1] = fraction, int > 1 = count, 1.0 = all
    abort_on_io_error: true  # a broken exam is retried (5 s apart) and then raises; never replaced by another exam
    multiprocessing_context: fork  # eval DataLoader worker start method; null -> inherit. Workers must never touch CUDA
    persistent_workers: true  # keep workers alive across head epochs (ignored when num_workers = 0)
  logging:
    tensorboard_dir: /hpcwork/va105917/curia/curia-b/eval/tb
    per_label_dir: /hpcwork/va105917/curia/curia-b/eval/eval_per_label
    tag_prefix: eval
  freq:
    knn: 1
    linear: 1
    linear_pool: 1
    attentive_pool: 1
    linear_slice_cls: 1
    attentive_slice_cls: 1
    attentive_slice_pool: 1
  knn:
    k: [5, 20, 50, 100]
    metric: cosine
    temperature: 0.07
    pooling: avg  # how the per-slice cls tokens are pooled into one per volume (avg | max)
    center: true  # subtract each sequence's mean feature before the per-sequence L2 normalisation
  linear:
    pooling: avg
    batchnorm: true  # non-affine BatchNorm1d (z-score) in front of the linear layer
    max_epochs: 50
    batch_size: 64  # exams
    grad_accum_steps: 1  # must stay 1 with batchnorm: true
    lr: 0.0015
    warmup_epochs: 10
    weight_decay: 0.0
  linear_pool:
    pooling: avg
    batchnorm: true  # non-affine BatchNorm1d (z-score) in front of the linear layer
    max_epochs: 50
    batch_size: 64  # exams
    grad_accum_steps: 1  # must stay 1 with batchnorm: true
    lr: 0.0015
    warmup_epochs: 10
    weight_decay: 0.0
  attentive_pool:
    q2l: false
    patch_sa_depth: 0
    qa_depth: 1
    num_heads: 16
    mlp_ratio: 4.0
    qkv_bias: true
    complete_block: true
    max_epochs: 50
    batch_size: 16
    grad_accum_steps: 1  # memory only: the head trains on micro-batches of batch_size / grad_accum_steps = 4 exams
    lr: 0.0005
    warmup_epochs: 10
    weight_decay: 0.001
  linear_slice_cls:
    batchnorm: true
    max_epochs: 50
    batch_size: 64
    grad_accum_steps: 1  # must stay 1 with batchnorm: true
    lr: 0.0015
    warmup_epochs: 10
    weight_decay: 0.0
  attentive_slice_cls:
    q2l: false
    patch_sa_depth: 0
    qa_depth: 1
    num_heads: 16
    mlp_ratio: 4.0
    qkv_bias: true
    complete_block: true
    max_epochs: 50
    batch_size: 64
    grad_accum_steps: 1  # memory only: the head trains on micro-batches of batch_size / grad_accum_steps exams
    lr: 0.0015
    warmup_epochs: 10
    weight_decay: 0.001
  attentive_slice_pool:
    q2l: false
    patch_sa_depth: 0
    qa_depth: 1
    num_heads: 16
    qkv_bias: true
    complete_block: true
    max_epochs: 50
    batch_size: 16
    grad_accum_steps: 1  # memory only: the head trains on micro-batches of batch_size / grad_accum_steps = 4 exams
    lr: 0.0005
    warmup_epochs: 10
    weight_decay: 0.001
